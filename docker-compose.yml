version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: docflow
      POSTGRES_PASSWORD: docflow123
      POSTGRES_DB: docflow_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend-net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - backend-net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    image: docflow-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      PORT: 3000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: docflow
      POSTGRES_PASSWORD: docflow123
      POSTGRES_DB: docflow_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: super_secret_key_for_swarm_cluster
    depends_on:
      - postgres
      - redis
    networks:
      - backend-net
      - frontend-net
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

  frontend:
    image: docflow-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    networks:
      - frontend-net
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

  nginx:
    image: docflow-nginx:latest
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    networks:
      - frontend-net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

volumes:
  postgres_data:
  redis_data:

networks:
  backend-net:
    driver: overlay
    attachable: true
  frontend-net:
    driver: overlay
    attachable: true